<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tam Thanh Chinese</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-100 min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const vocabList = [
      { id: "1", word: "我", pinyin: "wǒ", hanViet: "Ngã", meaning: "Tôi", level: "HSK 1" },
      { id: "2", word: "你", pinyin: "nǐ", hanViet: "Nhĩ", meaning: "Bạn", level: "HSK 1" },
      { id: "3", word: "他", pinyin: "<b>t</b>ā", hanViet: "Tha", meaning: "Anh ấy", level: "HSK 1" },
      { id: "4", word: "她", pinyin: "<b>t</b>ā", "hanViet": "Tha", meaning: "Cô ấy", level: "HSK 1" },
      { id: "5", word: "我们", pinyin: "wǒmen", hanViet: "Ngã Môn", meaning: "Chúng tôi", level: "HSK 1" },
      { id: "6", word: "爱", pinyin: "ài", hanViet: "Ái", meaning: "Yêu", level: "HSK 1" },
      { id: "7", word: "八", pinyin: "bā", hanViet: "Bát", meaning: "Số 8", level: "HSK 1" },
      { id: "8", word: "爸爸", pinyin: "bàba", "hanViet": "Ba Ba", "meaning": "Bố", level: "HSK 1" },
      { id: "9", word: "杯子", pinyin: "<b>b</b>ēi zi", hanViet: "Bôi Tử", meaning: "Cái cốc", level: "HSK 1" },
      { id: "10", word: "北京", "pinyin": "<b>b</b>ěi jīng", "hanViet": "Bắc Kinh", "meaning": "Bắc Kinh", level: "HSK 1" },
      { id: "11", word: "本", "pinyin": "<b>b</b>ěn", "hanViet": "Bản", "meaning": "Quyển, tập", "level": "HSK 1" },
      { id: "12", word: "不", "pinyin": "<b>b</b>ù", "hanViet": "Bất", "meaning": "Không", "level": "HSK 1" },
      { id: "13", word: "菜", "pinyin": "<b>c</b>ài", "hanViet": "Thái", "meaning": "Rau, món ăn", "level": "HSK 1" },
      { id: "14", word: "茶", "pinyin": "<b>ch</b>á", "hanViet": "Trà", "meaning": "Trà", "level": "HSK 1" },
      { id: "15", word: "吃", "pinyin": "<b>ch</b>ī", "hanViet": "Cật", "meaning": "Ăn", "level": "HSK 1" },
      { id: "16", word: "出租车", "pinyin": "<b>ch</b>ū zū <b>ch</b>ē", hanViet: "Xuất Tô Xa", meaning: "Xe taxi", level: "HSK 1" },
      { id: "17", "word": "打电话", "pinyin": "dǎ diàn huà", hanViet": "Đả Điển Thoại", meaning: "Gọi điện thoại", level: "HSK 1" },
      { id: "18", "word": "大", "pinyin": "dà", hanViet": "Đại", meaning: "To, lớn", "level": "HSK 1" },
      { id: "19", "word": "的", "pinyin": "de", hanViet": "Đích", meaning: "Của", level: "HSK 1" },
      { id: "20", "word": "点", "pinyin": "diǎn", hanViet": "Điểm", meaning: "Giờ, điểm", "level": "HSK 1" },
      { id: "21", "word": "电脑", "pinyin": "diàn nǎo", "hanViet": "Điện Não", meaning: "Máy vi tính", "level": "HSK 1" },
      { id: "22", "word": "电视", "pinyin": "diàn shì", "hanViet": "Điện Thị", meaning: "Ti vi", "level": "HSK 1" },
      { id: "23", "word": "电影", "pinyin": "diàn yǐng", "hanViet": "Điện Ảnh", meaning: "Phim", "level": "HSK 1" },
      { id: "24", "word": "东西", "pinyin": "dōng xi", "hanViet": "Đông Tây", meaning: "Đồ đạc", "level": "HSK 1" },
      { id: "25", "word": "都", "pinyin": "dōu", "hanViet": "Đô", meaning: "Đều", "level": "HSK 1" }
    ];

    function App() {
      return (
        <div className="max-w-md mx-auto p-4">
          <div className="bg-amber-500 text-white p-4 rounded-xl text-center font-bold mb-4">
            TAM THANH CHINESE ({vocabList.length} từ)
          </div>
          <div className="space-y-3">
            {vocabList.map(item => (
              <div key={item.id} className="bg-white p-4 rounded-xl shadow flex justify-between items-center">
                <div>
                  <h2 className="text-2xl font-bold">{item.word}</h2>
                  <p className="text-red-600 font-medium" dangerouslySetInnerHTML={{ __html: item.pinyin }}></p>
                </div>
                <div className="text-right">
                  <p className="font-bold">{item.meaning}</p>
                  <p className="text-xs text-slate-400 italic">({item.hanViet})</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
