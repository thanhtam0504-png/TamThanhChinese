      if (!hanzi) return '';
      return hanzi.split('').map(char => {
        return HAN_VIET_CORE_MAP[char] ? HAN_VIET_CORE_MAP[char].hv : char;
      }).join(' ');

      { id: '8-2', word: '兼容并蓄', pinyin: 'jiān róng bìng xù', hanViet: 'Kiêm Dung Tịnh Súc', meaning: 'Dung hợp tiếp thu mọi luồng tư tưởng', level: 'HSK 8', radical: '八 (Bát)', example: '大学应当倡导兼容并蓄的学风。 (Trường đại học cần cổ vũ học phong bao dung.)' },

      // HSK 9 (Bậc Thầy Ngôn Ngữ Chuẩn 3.0)
      { id: '9-1', word: '美美与共', pinyin: 'měi měi yǔ gòng', hanViet: 'Mỹ Mỹ Dữ Cộng', meaning: 'Cùng chung sống hòa hợp xán lạn, tôn vinh nét đẹp lẫn nhau', level: 'HSK 9', radical: '羊 (Dương)', example: '各美其美，美美与共，天下大同。 (Tự tôn nét đẹp mình, cùng tỏa sáng thì thiên hạ đại đồng.)' },
      { id: '9-2', word: '薪火相传', pinyin: 'xīn huǒ xiāng chuán', hanViet: 'Tân Hỏa Tương Truyền', meaning: 'Ngọn lửa tiếp nối lưu truyền qua nhiều thế hệ trường tồn', level: 'HSK 9', radical: '艹 (Thảo)', example: '优秀传统文化薪火相传。 (Văn hóa truyền thống được trao truyền tiếp nối.)' },
      { id: '9-3', word: '海纳百川', pinyin: 'hǎi nà bǎi chuān', hanViet: 'Hải Nạp Bách Xuyên', meaning: 'Biển lớn dung nạp trăm sông, khí phách bao la khoáng đạt', level: 'HSK 9', radical: '氵(Thủy)', example: '海纳百川，有容乃大；壁立千仞，无欲则刚。 (Biển ôm trăm sông mới vĩ đại, núi đứng ngàn trượng không dục ắt kiên cường.)' }
    ];

    function App() {
      const [vocabList, setVocabList] = useState(INITIAL_MASTER_VOCAB);
      const [currentTab, setCurrentTab] = useState('flashcards'); // 'flashcards' | 'dict' | 'bulk' | 'tones'
      const [selectedLevel, setSelectedLevel] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [cardIndex, setCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [darkMode, setDarkMode] = useState(false);

      // Tra cứu chiết tự trực tiếp
      const [lookupText, setLookupText] = useState('学习');
      const [bulkInput, setBulkInput] = useState('');

      // Lọc danh sách từ
      const filteredVocab = useMemo(() => {
        return vocabList.filter(item => {
          const matchLevel = selectedLevel === 'ALL' || item.level === selectedLevel;
          const matchSearch = searchQuery === '' || 
            item.word.includes(searchQuery) || 
            item.pinyin.toLowerCase().includes(searchQuery.toLowerCase()) || 
            item.meaning.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.hanViet.toLowerCase().includes(searchQuery.toLowerCase());
          return matchLevel && matchSearch;
        });
      }, [vocabList, selectedLevel, searchQuery]);

      const currentCard = filteredVocab[cardIndex] || filteredVocab[0] || vocabList[0];

      // Đổi Dark Mode
      useEffect(() => {
        if (darkMode) document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');
      }, [darkMode]);

      // Phân tích chiết tự từ đang tra cứu
      const analyzedLookup = useMemo(() => {
        const chars = lookupText.trim().split('');
        const details = chars.map(c => {
          return HAN_VIET_CORE_MAP[c] || { hv: convertHanziToHanViet(c), py: 'pīnyīn', rad: 'Bộ thủ', mn: 'Nghĩa từ vựng' };
        });
        return {
          word: lookupText,
          hanVietFull: convertHanziToHanViet(lookupText),
          charDetails: details
        };
      }, [lookupText]);

      // Nạp từ vựng hàng loạt (Bulk Import)
      const handleBulkImport = () => {
        if (!bulkInput.trim()) return;
        const lines = bulkInput.trim().split('\n');
        const newItems = [];
        lines.forEach((line, idx) => {
          const parts = line.split(/[|,\t]/).map(s => s.trim());
          if (parts.length >= 2) {
            const word = parts[0];
            const pinyin = parts[1] || '';
            const meaning = parts[2] || 'Đã nạp';
            const level = parts[3] || 'HSK 1';
            newItems.push({
              id: `bulk-${Date.now()}-${idx}`,
              word,
              pinyin,
              hanViet: convertHanziToHanViet(word),
              meaning,
              level,
              radical: 'Chuẩn 3.0',
              example: `${word} là từ vựng quan trọng cần ghi nhớ.`
            });
          }
        });
        if (newItems.length > 0) {
          setVocabList([...newItems, ...vocabList]);
          setBulkInput('');
          alert(`Đã nạp thành công ${newItems.length} từ vựng mới vào kho lưu trữ!`);
          setCurrentTab('flashcards');
          if (window.confetti) window.confetti();
        }
      };

      // Xuất Anki CSV
      const exportAnkiCsv = () => {
        const headers = ['Chữ Hán (Hanzi)', 'Pinyin', 'Âm Hán Việt', 'Nghĩa Tiếng Việt', 'Cấp Độ HSK', 'Ví Dụ'];
        const rows = filteredVocab.map(w => [
          `"${w.word}"`, `"${w.pinyin}"`, `"${w.hanViet}"`, `"${w.meaning}"`, `"${w.level}"`, `"${w.example || ''}"`
        ]);
        const csvContent = '\uFEFF' + [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `TamThanh_Chinese_HSK_${selectedLevel}.csv`;
        link.click();
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
          
          {/* HEADER */}
          <header className="sticky top-0 z-40 bg-white/95 dark:bg-slate-900/95 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 sm:px-8 py-3.5 flex items-center justify-between shadow-xs">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-red-700 to-rose-600 text-white font-black text-xl flex items-center justify-center shadow-md">
                三
              </div>
              <div>
                <h1 className="font-extrabold text-base sm:text-lg flex items-center gap-2">
                  <span className="text-red-700 dark:text-red-500">Tam Thanh Chinese</span>
                  <span className="text-[10px] font-black bg-red-100 dark:bg-red-950 text-red-700 dark:text-red-300 px-2 py-0.5 rounded-full border border-red-200 dark:border-red-800 uppercase">
                    HSK 1 - 9 Chuẩn 3.0 (11.092 Từ)
                  </span>
                </h1>
                <p className="text-xs text-slate-500">Tra cứu chiết tự, chuẩn hóa âm Hán Việt và học tập toàn diện</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <button
                onClick={exportAnkiCsv}
                className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 text-slate-700 dark:text-slate-300 text-xs font-bold"
              >
                📥 Xuất Anki CSV
              </button>
              <button
                onClick={() => setDarkMode(!darkMode)}
                className="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-xs font-bold"
              >
                {darkMode ? '☀️ Sáng' : '🌙 Tối'}
              </button>
            </div>
          </header>

          {/* THANH TAB ĐIỀU HƯỚNG */}
          <nav className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-8 py-2 flex items-center gap-2 overflow-x-auto custom-scrollbar">
            {[
              { id: 'flashcards', label: '📇 Flashcards 9 Cấp Độ' },
              { id: 'dict', label: '🔍 Tra Cứu & Chiết Tự Động' },
              { id: 'tones', label: '🎙️ Luyện 4 Thanh Điệu' },
              { id: 'bulk', label: '📥 Nạp Thêm Từ Vựng Hàng Loạt' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setCurrentTab(tab.id)}
                className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                  currentTab === tab.id
                    ? 'bg-red-700 text-white shadow-xs'
                    : 'bg-slate-50 dark:bg-slate-800/60 text-slate-600 dark:text-slate-400 hover:bg-slate-100'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          {/* MAIN VIEW */}
          <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-8 space-y-6">
            
            {/* TAB 1: FLASHCARDS 9 CẤP ĐỘ */}
            {currentTab === 'flashcards' && (
              <div className="space-y-6">
                
                {/* Bộ lọc HSK 1 - 9 */}
                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs">
                  <div className="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0 custom-scrollbar">
                    {['ALL', 'HSK 1', 'HSK 2', 'HSK 3', 'HSK 4', 'HSK 5', 'HSK 6', 'HSK 7', 'HSK 8', 'HSK 9'].map(lvl => (
                      <button
                        key={lvl}
                        onClick={() => { setSelectedLevel(lvl); setCardIndex(0); }}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                          selectedLevel === lvl 
                            ? 'bg-red-700 text-white shadow-xs' 
                            : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200'
                        }`}
                      >
                        {lvl}
                      </button>
                    ))}
                  </div>

                  <input
                    type="text"
                    placeholder="🔍 Tìm chữ Hán, Pinyin, Hán Việt..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full sm:w-64 px-4 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium focus:outline-none focus:border-red-600"
                  />
                </div>

                {/* Thẻ 3D Flashcard */}
                <div className="max-w-xl mx-auto space-y-4">
                  <div className="flex items-center justify-between text-xs font-bold text-slate-500">
                    <span>Thẻ {cardIndex + 1} / {filteredVocab.length} từ</span>
                    <span className="px-2.5 py-0.5 rounded-full bg-red-100 dark:bg-red-950 text-red-700 dark:text-red-300 font-mono">
                      {currentCard.level}
                    </span>
                  </div>

                  <div
                    onClick={() => setIsFlipped(!isFlipped)}
                    className={`min-h-[340px] p-8 rounded-3xl bg-white dark:bg-slate-900 border-2 transition-all duration-300 cursor-pointer shadow-xl flex flex-col justify-between items-center text-center ${
                      isFlipped ? 'border-emerald-500 bg-emerald-50/10' : 'border-slate-200 dark:border-slate-800 hover:border-red-400'
                    }`}
                  >
                    <div className="w-full flex items-center justify-between text-xs text-slate-400">
                      <span className="bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md font-mono">
                        Bộ thủ: {currentCard.radical}
                      </span>
                      <span className="text-[11px] font-semibold text-slate-400">
                        {isFlipped ? 'Chạm để lật lại' : 'Chạm để xem Pinyin, Hán Việt & Nghĩa'}
                      </span>
                    </div>

                    {!isFlipped ? (
                      <div className="space-y-4 my-auto">
                        <div className="text-7xl font-black hanzi-text text-slate-900 dark:text-slate-100 tracking-wider">
                          {currentCard.word}
                        </div>
                      </div>
                    ) : (
                      <div className="space-y-3 my-auto animate-in zoom-in-95 duration-200">
                        <div className="text-5xl font-black hanzi-text text-slate-900 dark:text-slate-100">
                          {currentCard.word}
                        </div>
                        <div className="text-xl font-black text-red-600 font-mono">
                          {currentCard.pinyin}
                        </div>
                        <div className="text-xs font-bold text-amber-800 dark:text-amber-300">
                          Âm Hán Việt: <span className="underline decoration-amber-500 font-black">{currentCard.hanViet}</span>
                        </div>
                        <div className="text-base font-bold text-slate-800 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 px-4 py-2 rounded-xl">
                          {currentCard.meaning}
                        </div>
                        {currentCard.example && (
                          <div className="text-xs text-slate-600 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/50 p-3 rounded-xl border border-slate-200 dark:border-slate-700 text-left">
                            <span className="font-bold text-red-600">Câu ví dụ: </span>
                            {currentCard.example}
                          </div>
                        )}
                      </div>
                    )}

                    <div className="w-full flex items-center justify-center pt-4 border-t border-slate-100 dark:border-slate-800">
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          speakChinese(currentCard.word);
                        }}
                        className="px-4 py-2 rounded-xl bg-red-50 dark:bg-red-950 text-red-700 dark:text-red-300 hover:bg-red-100 text-xs font-bold flex items-center gap-2"
                      >
                        🔊 Nghe Phát Âm Bản Xứ
                      </button>
                    </div>
                  </div>

                  <div className="flex items-center justify-between gap-3">
                    <button
                      onClick={() => { setIsFlipped(false); setCardIndex((prev) => (prev - 1 + filteredVocab.length) % (filteredVocab.length || 1)); }}
                      className="flex-1 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 font-bold text-xs rounded-2xl"
                    >
                      ← Thẻ trước
                    </button>
                    <button
                      onClick={() => { setIsFlipped(false); setCardIndex((prev) => (prev + 1) % (filteredVocab.length || 1)); }}
                      className="flex-1 py-3 bg-red-700 hover:bg-red-800 text-white font-bold text-xs rounded-2xl shadow-md"
                    >
                      Thẻ tiếp theo →
                    </button>
                  </div>
                </div>

              </div>
            )}

            {/* TAB 2: TRA CỨU & CHIẾT TỰ ĐỘNG CHO BẤT KỲ CHỮ NÀO */}
            {currentTab === 'dict' && (
              <div className="max-w-2xl mx-auto space-y-6">
                <div className="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-5">
                  <div>
                    <h3 className="text-lg font-bold">🔍 Bộ Máy Tra Cứu & Tách Chiết Tự Âm Hán Việt</h3>
                    <p className="text-xs text-slate-500">Nhập bất kỳ từ hoặc câu chữ Hán nào để phân tích âm Hán Việt chuẩn xác:</p>
                  </div>

                  <div className="flex gap-2">
                    <input
                      type="text"
                      value={lookupText}
                      onChange={(e) => setLookupText(e.target.value)}
                      placeholder="Nhập chữ Hán (ví dụ: 学习, 破釜沉舟, 砥砺前行)..."
                      className="flex-1 px-4 py-3 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-bold text-base hanzi-text"
                    />
                    <button
                      onClick={() => speakChinese(lookupText)}
                      className="px-4 py-3 rounded-2xl bg-red-700 text-white font-bold text-xs shadow-sm"
                    >
                      🔊 Đọc
                    </button>
                  </div>

                  <div className="p-5 rounded-2xl bg-red-50/50 dark:bg-red-950/30 border border-red-200 dark:border-red-800/60 space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs font-bold text-slate-500">Âm Hán Việt Tổng Thể:</span>
                      <span className="text-base font-black text-red-700 dark:text-red-400">
                        {analyzedLookup.hanVietFull}
                      </span>
                    </div>
                  </div>

                  <div className="space-y-3">
                    <h4 className="text-xs font-bold text-slate-400 uppercase">Chi Tiết Từng Chữ Hán (Chiết Tự):</h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      {lookupText.trim().split('').map((char, idx) => {
                        const info = HAN_VIET_CORE_MAP[char] || { hv: convertHanziToHanViet(char), py: '...', rad: 'Bộ thủ', mn: 'Nghĩa từ vựng' };
                        return (
                          <div key={idx} className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center gap-4">
                            <div className="w-14 h-14 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 flex items-center justify-center text-3xl font-black hanzi-text">
                              {char}
                            </div>
                            <div className="space-y-0.5 text-xs">
                              <p className="font-black text-red-600 text-sm">{info.hv}</p>
                              <p className="font-mono text-slate-500">[{info.py}]</p>
                              <p className="text-slate-400">{info.rad}</p>
                              <p className="font-medium text-slate-700 dark:text-slate-300">{info.mn}</p>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: LUYỆN 4 THANH ĐIỆU */}
            {currentTab === 'tones' && (
              <div className="max-w-2xl mx-auto space-y-6">
                <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                  <h3 className="text-lg font-bold">🎙️ Phân Tích Cao Độ 4 Thanh Điệu Chuẩn Bắc Kinh</h3>
                  <p className="text-xs text-slate-500">Nhấp vào từng thanh để luyện ngữ điệu chuẩn xác:</p>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {[
                      { name: 'Thanh 1 (Âm Bình 5-5)', pinyin: 'mā (妈)', desc: 'Cao và phẳng đều', sample: '妈' },
                      { name: 'Thanh 2 (Dương Bình 3-5)', pinyin: 'má (麻)', desc: 'Kéo từ trung bình lên cao', sample: '麻' },
                      { name: 'Thanh 3 (Thượng Thanh 2-1-4)', pinyin: 'mǎ (马)', desc: 'Xuống đáy rồi uốn nhẹ lên', sample: '马' },
                      { name: 'Thanh 4 (Khứ Thanh 5-1)', pinyin: 'mà (骂)', desc: 'Rơi dứt khoát từ đỉnh xuống đáy', sample: '骂' },
                    ].map((t, idx) => (
                      <div key={idx} className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-xs text-red-600">{t.name}</span>
                          <button
                            onClick={() => speakChinese(t.sample)}
                            className="p-1.5 rounded-lg bg-red-100 dark:bg-red-950 text-red-700 text-xs font-bold"
                          >
                            🔊 Nghe
                          </button>
                        </div>
                        <p className="text-lg font-black text-slate-900 dark:text-slate-100">{t.pinyin}</p>
                        <p className="text-xs text-slate-500">{t.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: NẠP TỪ VỰNG HÀNG LOẠT */}
            {currentTab === 'bulk' && (
              <div className="max-w-2xl mx-auto bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                <div>
                  <h3 className="text-lg font-bold">📥 Nạp Thêm Danh Sách Từ Vựng Hàng Loạt</h3>
                  <p className="text-xs text-slate-500">
                    Dán danh sách từ theo định dạng: <code className="bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded font-mono">Chữ Hán | Pinyin | Nghĩa | Cấp độ HSK</code>
                  </p>
                </div>

                <textarea
                  rows="6"
                  placeholder="Ví dụ:&#10;梦想 | mèngxiǎng | Ước mơ | HSK 3&#10;成功 | chénggōng | Thành công | HSK 4&#10;自强不息 | zì qiáng bù xī | Tự lực tự cường không ngừng | HSK 8"
                  value={bulkInput}
                  onChange={(e) => setBulkInput(e.target.value)}
                  className="w-full p-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 font-mono text-xs focus:outline-none focus:border-red-600"
                ></textarea>

                <button
                  onClick={handleBulkImport}
                  className="w-full py-3.5 rounded-2xl bg-red-700 hover:bg-red-800 text-white font-bold text-xs shadow-md transition-all"
                >
                  🚀 Bắt Đầu Nạp Vào Kho Lưu Trữ
                </button>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer className="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-4 text-center text-xs text-slate-500 mt-auto">
            Tam Thanh Chinese &copy; 2026 - Bản 1 File Standalone Chuẩn 3.0 HSK 1 - 9
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
