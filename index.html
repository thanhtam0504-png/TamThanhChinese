  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // WEB SPEECH API PHÁT ÂM TIẾNG TRUNG BẢN XỨ
    const speakChinese = (text, rate = 0.85) => {
      if (!('speechSynthesis' in window)) {
        alert('Trình duyệt của bạn không hỗ trợ Web Speech API.');
        return;
      }
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'zh-CN';
      utterance.rate = rate;
      window.speechSynthesis.speak(utterance);
    };

    // KHO TỪ VỰNG CHUẨN HSK 1 ĐẾN HSK 9 (CHUẨN 3.0 MỚI NHẤT)

      // HSK 2

      { id: '2-3', word: '运动', pinyin: 'yùndòng', hanViet: 'Vận Động', meaning: 'Thể thao, tập thể dục', level: 'HSK 2', radical: '辶 (Xước)', category: 'Sức khỏe', example: '每天坚持运动半小时。 (Mỗi ngày kiên trì vận động 30 phút.)' },
      { id: '2-4', word: '便宜', pinyin: 'piányi', hanViet: 'Tiện Nghi', meaning: 'Rẻ, giá cả phải chăng', level: 'HSK 2', radical: '亻(Nhân)', category: 'Mua sắm', example: '这家超市的水果很便宜。 (Hoa quả ở siêu thị này rất rẻ.)' },

      // HSK 3
      { id: '3-1', word: '提高', pinyin: 'tígāo', hanViet: 'Đề Cao', meaning: 'Nâng cao, cải thiện', level: 'HSK 3', radical: '扌(Thủ)', category: 'Phát triển', example: '多练习能提高口语水平。 (Luyện tập nhiều sẽ nâng cao trình độ nói.)' },
      { id: '3-2', word: '解决', pinyin: 'jiějué', hanViet: 'Giải Quyết', meaning: 'Giải quyết, xử lý', level: 'HSK 3', radical: '角 (Giác)', category: 'Công việc', example: '我们要想办法解决问题。 (Chúng ta phải nghĩ cách giải quyết vấn đề.)' },
      { id: '3-3', word: '习惯', pinyin: 'xíguàn', hanViet: 'Tập Quán', meaning: 'Thói quen, quen với', level: 'HSK 3', radical: '羽 (Vũ)', category: 'Đời sống', example: '早起是一个好习惯。 (Dậy sớm là một thói quen tốt.)' },

      // HSK 4
      { id: '4-1', word: '顺利', pinyin: 'shùnlì', hanViet: 'Thuận Lợi', meaning: 'Thuận lợi, suôn sẻ', level: 'HSK 4', radical: '页 (Hiệt)', category: 'Công sở', example: '祝你这次面试一切顺利！ (Chúc buổi phỏng vấn của bạn mọi sự thuận lợi!)' },
      { id: '4-2', word: '申请', pinyin: 'shēnqǐng', hanViet: 'Thân Thỉnh', meaning: 'Nộp đơn xin, đăng ký', level: 'HSK 4', radical: '田 (Điền)', category: 'Hành chính', example: '他申请到了中国奖学金。 (Anh ấy đã xin được học bổng Trung Quốc.)' },
      { id: '4-3', word: '坚持', pinyin: 'jiānchí', hanViet: 'Kiên Trì', meaning: 'Kiên trì, bền bỉ', level: 'HSK 4', radical: '土 (Thổ)', category: 'Ý chí', example: '坚持就是胜利。 (Kiên trì chính là thắng lợi.)' },

      // HSK 5
      { id: '5-1', word: '鉴于', pinyin: 'jiànyú', hanViet: 'Giám Vu', meaning: 'Xét thấy, căn cứ vào', level: 'HSK 5', radical: '金 (Kim)', category: 'Thương mại', example: '鉴于市场环境，公司推迟发布。 (Xét thấy môi trường thị trường, công ty hoãn ra mắt.)' },
      { id: '5-2', word: '措施', pinyin: 'cuòshī', hanViet: 'Thốc Thi', meaning: 'Biện pháp, giải pháp', level: 'HSK 5', radical: '扌(Thủ)', category: 'Chính sách', example: '政府采取了有力措施。 (Chính phủ đã áp dụng biện pháp đắc lực.)' },
      { id: '5-3', word: '谈判', pinyin: 'tánpàn', hanViet: 'Đàm Phán', meaning: 'Đàm phán thương vụ', level: 'HSK 5', radical: '讠(Ngôn)', category: 'Kinh doanh', example: '商务谈判达成了共识。 (Đàm phán thương mại đã đạt nhận thức chung.)' },

      { id: '6-2', word: '韬光养晦', pinyin: 'tāo guāng yǎng huì', hanViet: 'Thao Quang Dưỡng Hối', meaning: 'Giấu mình chờ thời, tích lũy năng lượng', level: 'HSK 6', radical: '韦 (Vi)', category: 'Chiến lược', example: '在实力未充时应韬光养晦。 (Khi thực lực chưa đủ cần biết giấu mình chờ thời.)' },

      // HSK 7 (Chuẩn 3.0 Mới)
      { id: '7-1', word: '恪守', pinyin: 'kèshǒu', hanViet: 'Khắc Thủ', meaning: 'Nghiêm túc tuân thủ chuẩn mực quy tắc', level: 'HSK 7', radical: '忄(Tâm)', category: 'Học thuật 3.0', example: '企业在跨国经营中恪守法律准则。 (Doanh nghiệp luôn tuân thủ chuẩn mực pháp lý.)' },
      { id: '7-2', word: '涵养', pinyin: 'hányǎng', hanViet: 'Hàm Dưỡng', meaning: 'Tu dưỡng tâm tính, nuôi dưỡng nguồn tài nguyên', level: 'HSK 7', radical: '氵(Thủy)', category: 'Tu dưỡng 3.0', example: '他具有极高的文化涵养。 (Ông ấy có hàm dưỡng văn hóa rất cao.)' },
      { id: '7-3', word: '磋商', pinyin: 'cuōshāng', hanViet: 'Tha Thương', meaning: 'Tham vấn cấp cao, trao đổi đa phương', level: 'HSK 7', radical: '石 (Thạch)', category: 'Ngoại giao 3.0', example: '两国代表团举行了深入磋商。 (Phái đoàn hai nước đã tiến hành tham vấn sâu sắc.)' },

      // HSK 8 (Chuẩn 3.0 Mới)
      { id: '8-1', word: '砥砺前行', pinyin: 'dǐ lì qián xíng', hanViet: 'Chỉ Lệ Tiền Hành', meaning: 'Rèn giũa ý chí vững bước tiến lên', level: 'HSK 8', radical: '石 (Thạch)', category: 'Chính luận 3.0', example: '面对变局，我们唯有砥砺前行。 (Đối diện biến cục, chúng ta chỉ có tôi luyện ý chí vững bước.)' },
      { id: '8-2', word: '兼容并蓄', pinyin: 'jiān róng bìng xù', hanViet: 'Kiêm Dung Tịnh Súc', meaning: 'Dung hợp tiếp thu mọi tinh hoa văn hóa', level: 'HSK 8', radical: '八 (Bát)', category: 'Triết học 3.0', example: '大学应当倡导兼容并蓄的学风。 (Trường đại học cần cổ vũ học phong dung hòa tư tưởng.)' },

      // HSK 9 (Bậc Thầy Ngôn Ngữ Chuẩn 3.0 Mới)
      { id: '9-1', word: '美美与共', pinyin: 'měi měi yǔ gòng', hanViet: 'Mỹ Mỹ Dữ Cộng', meaning: 'Cùng chung sống hòa hợp xán lạn, tôn vinh nét đẹp lẫn nhau', level: 'HSK 9', radical: '羊 (Dương)', category: 'Bậc thầy 3.0', example: '各美其美，美美与共，天下大同。 (Tự tôn nét đẹp của mình, tôn trọng nét đẹp người khác, thiên hạ thái bình.)' },
      { id: '9-2', word: '薪火相传', pinyin: 'xīn huǒ xiāng chuán', hanViet: 'Tân Hỏa Tương Truyền', meaning: 'Ngọn lửa tiếp nối lưu truyền qua nhiều thế hệ trường tồn', level: 'HSK 9', radical: '艹 (Thảo)', category: 'Kế thừa 3.0', example: '中华优秀传统文化薪火相传。 (Văn hóa truyền thống ưu tú được tiếp nối trao truyền.)' },
      { id: '9-3', word: '海纳百川', pinyin: 'hǎi nà bǎi chuān', hanViet: 'Hải Nạp Bách Xuyên', meaning: 'Biển lớn dung nạp trăm sông, khí phách bao la khoáng đạt', level: 'HSK 9', radical: '氵(Thủy)', category: 'Đại dương 3.0', example: '海纳百川，有容乃大。 (Biển ôm trăm sông, có dung nạp mới thành vĩ đại.)' }
    ];

    // VIDEO NGẮN LUYỆN SHADOWING
    const SHORT_VIDEOS = [
      {
        id: 'v1',
        title: 'Đặt Cà Phê Bằng Tiếng Trung Chuẩn Bản Xứ',
        creator: 'Cô Tâm Thanh',
        hskLevel: 'HSK 2',
        videoUrl: 'https://images.unsplash.com/photo-1501339847302-ac426a4a7cbb?w=800&auto=format&fit=crop&q=80',
        captions: [
          { time: '0:01', hanzi: '你好，我要一杯拿铁，少糖。', pinyin: 'Nǐ hǎo, wǒ yào yī bēi nátiě, shǎo táng.', viet: 'Xin chào, tôi muốn một ly Latte, ít đường.' },
          { time: '0:03', hanzi: '热的还是加冰的？', pinyin: 'Rè de háishì jiā bīng de?', viet: 'Uống nóng hay thêm đá ạ?' },
          { time: '0:05', hanzi: '请给我大杯加冰的，谢谢！', pinyin: 'Qǐng gěi wǒ dà bēi jiā bīng de, xièxie!', viet: 'Cho tôi ly lớn có đá nhé, cảm ơn!' }
        ]
      },
      {
        id: 'v2',
        title: 'Đàm Phán Báo Giá & Chiết Khấu Trong Công Sở',
        creator: 'Thầy Hoàng Minh',
        hskLevel: 'HSK 4',
        videoUrl: 'https://images.unsplash.com/photo-1551836022-d5d88e9218df?w=800&auto=format&fit=crop&q=80',
        captions: [
          { time: '0:01', hanzi: '贵公司的报价比市场平均价略高。', pinyin: 'Guì gōngsī de bàojià bǐ shìchǎng píngjūnjià lüè gāo.', viet: 'Báo giá của quý công ty hơi cao hơn mặt bằng chung.' },
          { time: '0:04', hanzi: '如果首批订购五千件，能享受多少折扣？', pinyin: 'Rúguǒ shǒupī dìnggòu wǔqiān jiàn, néng xiǎngshòu duōshao zhékòu?', viet: 'Nếu đợt đầu đặt 5000 chiếc thì được chiết khấu bao nhiêu?' }
        ]
      }
    ];

    // COMPONENT CHÍNH CỦA TOÀN BỘ ỨNG DỤNG
    function App() {
      const [currentTab, setCurrentTab] = useState('flashcards');
      const [darkMode, setDarkMode] = useState(false);
      const [selectedLevel, setSelectedLevel] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [cardIndex, setCardIndex] = useState(0);
      const [isFlipped, setIsFlipped] = useState(false);
      const [bookmarkedWords, setBookmarkedWords] = useState([]);
      const [streak, setStreak] = useState(7);
      const [studyMinutes, setStudyMinutes] = useState(45);

      // Lọc danh sách từ vựng theo HSK 1 - 9 và từ khóa
      const filteredVocab = useMemo(() => {
        return MASTER_VOCABULARY.filter(item => {
          const matchLevel = selectedLevel === 'ALL' || item.level === selectedLevel;
          const matchSearch = searchQuery === '' || 
            item.word.includes(searchQuery) || 
            item.pinyin.toLowerCase().includes(searchQuery.toLowerCase()) || 
            item.meaning.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.hanViet.toLowerCase().includes(searchQuery.toLowerCase());
          return matchLevel && matchSearch;
        });
      }, [selectedLevel, searchQuery]);

      const currentCard = filteredVocab[cardIndex] || filteredVocab[0] || MASTER_VOCABULARY[0];

      // Đổi chế độ Sáng / Tối
      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      const handleNextCard = () => {
        setIsFlipped(false);
        setCardIndex((prev) => (prev + 1) % (filteredVocab.length || 1));
      };

      const handlePrevCard = () => {
        setIsFlipped(false);
        setCardIndex((prev) => (prev - 1 + filteredVocab.length) % (filteredVocab.length || 1));
      };

      const toggleBookmark = (word) => {
        if (bookmarkedWords.includes(word)) {
          setBookmarkedWords(bookmarkedWords.filter(w => w !== word));
        } else {
          setBookmarkedWords([...bookmarkedWords, word]);
          if (window.confetti) {
            window.confetti({ particleCount: 30, spread: 60, origin: { y: 0.8 } });
          }
        }
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
          
          {/* THANH ĐIỀU HƯỚNG TRÊN CÙNG (HEADER) */}

            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-2xl bg-gradient-to-tr from-red-700 to-rose-600 text-white font-black text-xl flex items-center justify-center shadow-md">
                三
              </div>
              <div>
                <h1 className="font-extrabold text-base sm:text-lg tracking-tight flex items-center gap-1.5">
                  <span className="text-red-700 dark:text-red-500">Tam Thanh</span>
                  <span>Chinese</span>
                  <span className="text-[10px] uppercase font-black bg-red-100 dark:bg-red-950 text-red-700 dark:text-red-300 px-2 py-0.5 rounded-full border border-red-200 dark:border-red-800">
                    HSK 1 - 9 Chuẩn 3.0
                  </span>
                </h1>
                <p className="text-[11px] text-slate-500 font-medium">Học Tiếng Trung Toàn Diện & Phân Tích Chiết Tự 11.092 Từ</p>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <div className="hidden sm:flex items-center gap-2 bg-slate-100 dark:bg-slate-800 px-3 py-1.5 rounded-xl text-xs font-bold">
                <span className="text-amber-500">🔥 {streak} ngày</span>
                <span className="text-slate-300 dark:text-slate-600">|</span>
                <span className="text-blue-500">⏱️ {studyMinutes} phút</span>
              </div>

              <button
                onClick={() => setDarkMode(!darkMode)}
                className="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 text-xs font-bold transition-all"
              >
                {darkMode ? '☀️ Sáng' : '🌙 Tối'}
              </button>
            </div>
          </header>

          {/* MENU TAB CHỨC NĂNG */}
          <nav className="bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 px-4 sm:px-6 py-2 flex items-center gap-2 overflow-x-auto custom-scrollbar">
            {[
              { id: 'flashcards', label: '📇 Flashcards HSK 1-9' },
              { id: 'short_videos', label: '🎬 Video Shadowing Câu Thoại' },
              { id: 'spaced_repetition', label: '🔄 Ôn Tập SM-2 (Leitner)' },
              { id: 'assessment', label: '🎯 Đánh Giá Trình Độ HSK' },
              { id: 'tone_analyzer', label: '🎙️ Luyện 4 Thanh Điệu' },
              { id: 'all_words', label: '📖 Tra Cứu Toàn Bộ 9 Cấp Độ' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setCurrentTab(tab.id)}
                className={`px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap transition-all ${
                  currentTab === tab.id
                    ? 'bg-red-700 text-white shadow-xs'
                    : 'bg-slate-50 dark:bg-slate-800/80 text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`}
              >
                {tab.label}
              </button>
            ))}
          </nav>

          {/* NỘI DUNG CHÍNH (MAIN VIEW) */}
          <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 space-y-6">
            
            {/* TAB 1: FLASHCARDS HSK 1 - 9 */}
            {currentTab === 'flashcards' && (
              <div className="space-y-6">
                
                {/* Bộ lọc HSK 1-9 & Ô tìm kiếm */}
                <div className="flex flex-col sm:flex-row items-center justify-between gap-3 bg-white dark:bg-slate-900 p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-xs">
                  <div className="flex items-center gap-1.5 overflow-x-auto w-full sm:w-auto pb-1 sm:pb-0 custom-scrollbar">
                    {['ALL', 'HSK 1', 'HSK 2', 'HSK 3', 'HSK 4', 'HSK 5', 'HSK 6', 'HSK 7', 'HSK 8', 'HSK 9'].map(lvl => (
                      <button
                        key={lvl}
                        onClick={() => { setSelectedLevel(lvl); setCardIndex(0); }}
                        className={`px-3 py-1.5 rounded-lg text-xs font-bold whitespace-nowrap transition-all ${
                          selectedLevel === lvl 
                            ? 'bg-red-700 text-white shadow-xs' 
                            : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 hover:bg-slate-200'
                        }`}
                      >
                        {lvl}
                      </button>
                    ))}
                  </div>

                  <input
                    type="text"
                    placeholder="Tìm theo chữ Hán, Pinyin, Hán Việt..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full sm:w-64 px-3.5 py-2 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-xs font-medium focus:outline-none focus:border-red-600"
                  />
                </div>

                {/* Thẻ Flashcard 3D Lật Mở */}
                <div className="max-w-xl mx-auto space-y-4">
                  <div className="flex items-center justify-between text-xs font-bold text-slate-500">
                    <span>Thẻ {cardIndex + 1} / {filteredVocab.length || 1}</span>
                    <span className="px-2.5 py-0.5 rounded-full bg-red-100 dark:bg-red-950 text-red-700 dark:text-red-300">
                      {currentCard.level}
                    </span>
                  </div>

                  <div
                    onClick={() => setIsFlipped(!isFlipped)}
                    className={`min-h-[340px] p-8 rounded-3xl bg-white dark:bg-slate-900 border-2 transition-all duration-300 cursor-pointer shadow-xl flex flex-col justify-between items-center text-center ${
                      isFlipped ? 'border-emerald-500 dark:border-emerald-700 bg-emerald-50/20' : 'border-slate-200 dark:border-slate-800 hover:border-red-400'
                    }`}
                  >
                    <div className="w-full flex items-center justify-between text-xs text-slate-400">
                      <span className="bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md font-mono">
                        {currentCard.category}
                      </span>
                      <span className="text-[11px] font-semibold text-slate-400">
                        {isFlipped ? 'Chạm để xem chữ Hán' : 'Chạm để lật xem nghĩa & câu ví dụ'}
                      </span>
                    </div>

                    {!isFlipped ? (
                      <div className="space-y-4 my-auto">
                        <div className="text-7xl font-black hanzi-text text-slate-900 dark:text-slate-100 tracking-wider">
                          {currentCard.word}
                        </div>
                        <p className="text-xs text-slate-400">
                          Bộ thủ: <span className="font-bold text-slate-600 dark:text-slate-300">{currentCard.radical}</span>
                        </p>
                      </div>
                    ) : (
                      <div className="space-y-3 my-auto animate-in zoom-in-95 duration-200">
                        <div className="text-5xl font-black hanzi-text text-slate-900 dark:text-slate-100">
                          {currentCard.word}
                        </div>
                        <div className="text-xl font-black text-red-600 dark:text-red-400 font-mono">
                          {currentCard.pinyin}
                        </div>
                        <div className="text-xs font-bold text-amber-800 dark:text-amber-300">
                          Hán Việt: {currentCard.hanViet}
                        </div>
                        <div className="text-base font-bold text-slate-800 dark:text-slate-200 bg-slate-100 dark:bg-slate-800/80 px-4 py-2 rounded-xl">
                          {currentCard.meaning}
                        </div>
                        {currentCard.example && (
                          <div className="text-xs text-slate-600 dark:text-slate-400 bg-slate-50 dark:bg-slate-800/50 p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 text-left">
                            <span className="font-bold text-red-600">Ví dụ: </span>
                            {currentCard.example}
                          </div>
                        )}
                      </div>
                    )}

                    <div className="w-full flex items-center justify-between pt-4 border-t border-slate-100 dark:border-slate-800">
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          speakChinese(currentCard.word);
                        }}
                        className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-red-50 text-slate-700 dark:text-slate-300 hover:text-red-700 text-xs font-bold flex items-center gap-1.5"
                      >
                        🔊 Nghe phát âm
                      </button>

                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          toggleBookmark(currentCard.word);
                        }}
                        className={`px-3 py-1.5 rounded-xl text-xs font-bold flex items-center gap-1 ${
                          bookmarkedWords.includes(currentCard.word)
                            ? 'bg-amber-500 text-white'
                            : 'bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400'
                        }`}
                      >
                        ⭐ {bookmarkedWords.includes(currentCard.word) ? 'Đã lưu sổ tay' : 'Lưu sổ tay'}
                      </button>
                    </div>
                  </div>

                  {/* Nút lùi / tiến thẻ */}
                  <div className="flex items-center justify-between gap-3">
                    <button
                      onClick={handlePrevCard}
                      className="flex-1 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 font-bold text-xs rounded-2xl transition-all shadow-xs"
                    >
                      ← Thẻ trước
                    </button>
                    <button
                      onClick={handleNextCard}
                      className="flex-1 py-3 bg-red-700 hover:bg-red-800 text-white font-bold text-xs rounded-2xl transition-all shadow-md"
                    >
                      Thẻ tiếp theo →
                    </button>
                  </div>
                </div>

              </div>
            )}

            {/* TAB 2: VIDEO NGẮN LUYỆN SHADOWING */}
            {currentTab === 'short_videos' && (
              <div className="max-w-2xl mx-auto space-y-6">
                <div className="p-5 rounded-3xl bg-gradient-to-r from-purple-950 via-indigo-950 to-slate-900 text-white space-y-2">
                  <span className="text-[10px] font-black bg-purple-500/40 text-purple-200 px-2.5 py-1 rounded-full uppercase">
                    TikTok/Reels Chinese Shadowing
                  </span>
                  <h2 className="text-xl font-bold">Video Ngắn Luyện Nghe & Đọc Đuổi Câu Thoại</h2>
                  <p className="text-xs text-purple-200">
                    Phụ đề song ngữ kèm Pinyin hỗ trợ nghe giọng bản xứ với ngữ điệu tự nhiên.
                  </p>
                </div>

                {SHORT_VIDEOS.map(video => (
                  <div key={video.id} className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-5 shadow-sm space-y-4">
                    <div className="flex items-center justify-between">
                      <div>
                        <span className="text-xs font-bold text-purple-600 dark:text-purple-400 bg-purple-50 dark:bg-purple-950 px-2.5 py-0.5 rounded-md">
                          {video.hskLevel}
                        </span>
                        <h3 className="font-bold text-base mt-1">{video.title}</h3>
                        <p className="text-[11px] text-slate-400">Giảng viên: {video.creator}</p>
                      </div>
                    </div>

                    <div className="relative rounded-2xl overflow-hidden aspect-video bg-slate-900 flex items-center justify-center">
                      <img src={video.videoUrl} alt={video.title} className="w-full h-full object-cover opacity-60" />
                      <button
                        onClick={() => {
                          const fullText = video.captions.map(c => c.hanzi).join(' ');
                          speakChinese(fullText, 0.8);
                        }}
                        className="absolute w-14 h-14 rounded-full bg-red-600/90 text-white flex items-center justify-center text-xl shadow-lg hover:scale-110 transition-transform"
                      >
                        ▶
                      </button>
                    </div>

                    <div className="space-y-2">
                      <p className="text-xs font-bold text-slate-500 uppercase">Phụ đề & Shadowing từng câu:</p>
                      {video.captions.map((cap, cIdx) => (
                        <div
                          key={cIdx}
                          onClick={() => speakChinese(cap.hanzi)}
                          className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60 hover:bg-red-50 dark:hover:bg-red-950/40 border border-slate-200 dark:border-slate-700 cursor-pointer transition-all flex items-center justify-between"
                        >
                          <div className="space-y-0.5">
                            <p className="text-sm font-black text-slate-900 dark:text-slate-100">{cap.hanzi}</p>
                            <p className="text-xs font-mono text-red-600 dark:text-red-400">{cap.pinyin}</p>
                            <p className="text-xs text-slate-500">{cap.viet}</p>
                          </div>
                          <button className="text-xs font-bold text-red-600 p-2">
                            🔊 Đọc
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* TAB 3: THUẬT TOÁN SM-2 (SPACED REPETITION) */}
            {currentTab === 'spaced_repetition' && (
              <div className="space-y-6">
                <div className="p-6 rounded-3xl bg-gradient-to-r from-amber-950 to-slate-900 text-white space-y-2">
                  <span className="text-[10px] font-black bg-amber-500/40 text-amber-200 px-2.5 py-1 rounded-full uppercase">
                    Leitner Box & SM-2 Algorithm
                  </span>
                  <h2 className="text-xl font-bold">Ôn Tập Lặp Lại Ngắt Quãng (Spaced Repetition)</h2>
                  <p className="text-xs text-amber-200">
                    Ghi nhớ dài hạn giúp não bộ nhớ từ vựng vĩnh viễn theo chu kỳ 1 ngày, 3 ngày, 7 ngày, 16 ngày và 30 ngày.
                  </p>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 text-center">
                  {[
                    { box: 'Hộp 1', days: '1 ngày', count: 5, color: 'text-rose-500' },
                    { box: 'Hộp 2', days: '3 ngày', count: 8, color: 'text-amber-500' },
                    { box: 'Hộp 3', days: '7 ngày', count: 12, color: 'text-blue-500' },
                    { box: 'Hộp 4', days: '16 ngày', count: 6, color: 'text-teal-500' },
                    { box: 'Hộp 5', days: '30 ngày', count: 15, color: 'text-emerald-500' },
                  ].map((b, idx) => (
                    <div key={idx} className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-xs">
                      <p className="text-xs font-bold text-slate-400">{b.box} ({b.days})</p>
                      <p className={`text-2xl font-black mt-1 ${b.color}`}>{b.count}</p>
                      <p className="text-[10px] text-slate-500">từ vựng</p>
                    </div>
                  ))}
                </div>

                <div className="p-6 bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 space-y-4">
                  <h3 className="text-sm font-bold">Danh sách từ đang theo dõi trong SRS:</h3>
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {MASTER_VOCABULARY.slice(0, 8).map(w => (
                      <div key={w.id} className="p-3.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex items-center justify-between">
                        <div>
                          <span className="font-bold text-base">{w.word}</span>
                          <span className="text-xs font-mono text-red-600 ml-2">[{w.pinyin}]</span>
                          <p className="text-xs text-slate-500">{w.meaning}</p>
                        </div>
                        <button
                          onClick={() => speakChinese(w.word)}
                          className="px-2.5 py-1 rounded-lg bg-red-50 dark:bg-red-950 text-red-700 dark:text-red-300 text-xs font-bold"
                        >
                          🔊 Nghe
                        </button>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: ĐÁNH GIÁ TRÌNH ĐỘ HSK */}
            {currentTab === 'assessment' && (
              <div className="max-w-2xl mx-auto space-y-6">
                <div className="bg-white dark:bg-slate-900 p-6 sm:p-8 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4 text-center">
                  <div className="w-16 h-16 rounded-full bg-red-100 dark:bg-red-950 text-red-600 flex items-center justify-center text-2xl mx-auto">
                    🎯
                  </div>
                  <h2 className="text-xl font-bold">Kiểm Tra Chẩn Đoán Trình Độ Nhanh</h2>
                  <p className="text-xs text-slate-500 max-w-md mx-auto">
                    Hệ thống đánh giá vốn từ vựng, ngữ pháp câu chữ 把/被, văn phong công sở và đề xuất lộ trình phù hợp từ HSK 1 đến HSK 9.
                  </p>

                  <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 text-left space-y-3">
                    <p className="text-xs font-bold text-red-600">Câu hỏi: Điền từ thích hợp vào chỗ trống:</p>
                    <p className="text-base font-bold">昨天晚上我_____了两个小时的汉语。</p>
                    <div className="grid grid-cols-2 gap-2">
                      {['A. 学', 'B. 学习', 'C. 教', 'D. 读'].map((opt, i) => (
                        <button
                          key={i}
                          onClick={() => {
                            if (i === 1) {
                              alert('Chính xác! Cấu trúc bổ ngữ thời lượng: 学习了 + Khoảng thời gian');
                              if (window.confetti) window.confetti();
                            } else {
                              alert('Chưa chính xác. Đáp án đúng là B. 学习');
                            }
                          }}
                          className="p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 hover:border-red-500 text-xs font-semibold text-left transition-all"
                        >
                          {opt}
                        </button>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: PHÂN TÍCH 4 THANH ĐIỆU */}
            {currentTab === 'tone_analyzer' && (
              <div className="max-w-2xl mx-auto space-y-6">
                <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                  <h2 className="text-lg font-bold flex items-center gap-2">
                    <span>🎙️ Phân Tích 4 Thanh Điệu Tiếng Trung</span>
                  </h2>
                  <p className="text-xs text-slate-500">
                    Bấm vào từng thanh điệu để nghe giọng chuẩn và luyện tập phát âm cao độ (5-5, 3-5, 2-1-4, 5-1).
                  </p>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    {[
                      { name: 'Thanh 1 (Âm Bình 5-5)', pinyin: 'mā (妈)', desc: 'Cao và phẳng đều', sample: '妈' },
                      { name: 'Thanh 2 (Dương Bình 3-5)', pinyin: 'má (麻)', desc: 'Kéo từ trung bình lên cao (như dấu sắc)', sample: '麻' },
                      { name: 'Thanh 3 (Thượng Thanh 2-1-4)', pinyin: 'mǎ (马)', desc: 'Xuống thấp rồi uốn lên (như dấu hỏi)', sample: '马' },
                      { name: 'Thanh 4 (Khứ Thanh 5-1)', pinyin: 'mà (骂)', desc: 'Dứt khoát rơi từ đỉnh xuống đáy', sample: '骂' },
                    ].map((t, idx) => (
                      <div key={idx} className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 space-y-2">
                        <div className="flex items-center justify-between">
                          <span className="font-bold text-xs text-red-600">{t.name}</span>
                          <button
                            onClick={() => speakChinese(t.sample)}
                            className="p-1.5 rounded-lg bg-red-100 dark:bg-red-950 text-red-700 text-xs font-bold"
                          >
                            🔊 Nghe
                          </button>
                        </div>
                        <p className="text-lg font-black text-slate-900 dark:text-slate-100">{t.pinyin}</p>
                        <p className="text-xs text-slate-500">{t.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 6: TRA CỨU TOÀN BỘ TỪ VỰNG HSK 1 - 9 */}
            {currentTab === 'all_words' && (
              <div className="bg-white dark:bg-slate-900 p-6 rounded-3xl border border-slate-200 dark:border-slate-800 shadow-sm space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-base font-bold">Bảng Tra Cứu Toàn Bộ Từ Vựng ({MASTER_VOCABULARY.length} mục từ tiêu chuẩn HSK 1 - 9)</h2>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs">
                    <thead>
                      <tr className="border-b border-slate-200 dark:border-slate-700 text-slate-400 font-bold">
                        <th className="py-2.5 px-3">Chữ Hán</th>
                        <th className="py-2.5 px-3">Pinyin</th>
                        <th className="py-2.5 px-3">Hán Việt</th>
                        <th className="py-2.5 px-3">Nghĩa Tiếng Việt</th>
                        <th className="py-2.5 px-3">Bộ Thủ</th>
                        <th className="py-2.5 px-3">Cấp Độ</th>
                        <th className="py-2.5 px-3 text-right">Phát Âm</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                      {MASTER_VOCABULARY.map(w => (
                        <tr key={w.id} className="hover:bg-slate-50 dark:hover:bg-slate-800/50">
                          <td className="py-3 px-3 text-base font-black hanzi-text">{w.word}</td>
                          <td className="py-3 px-3 font-mono font-bold text-red-600">{w.pinyin}</td>
                          <td className="py-3 px-3 text-slate-600 dark:text-slate-400">{w.hanViet}</td>
                          <td className="py-3 px-3 font-semibold text-slate-800 dark:text-slate-200">{w.meaning}</td>
                          <td className="py-3 px-3 text-slate-500 font-mono">{w.radical}</td>
                          <td className="py-3 px-3">
                            <span className="px-2 py-0.5 rounded-md bg-red-50 dark:bg-red-950 text-red-700 dark:text-red-300 font-bold">
                              {w.level}
                            </span>
                          </td>
                          <td className="py-3 px-3 text-right">
                            <button
                              onClick={() => speakChinese(w.word)}
                              className="px-2.5 py-1 bg-slate-100 dark:bg-slate-800 hover:bg-red-50 rounded-lg text-slate-700 dark:text-slate-300 hover:text-red-700 font-bold"
                            >
                              🔊
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

          </main>

          {/* CHÂN TRANG (FOOTER) */}
          <footer className="border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 py-6 text-center text-xs text-slate-500 mt-auto">
            <p className="font-bold text-slate-700 dark:text-slate-300">Tam Thanh Chinese &copy; 2026 - Bản Xuất Độc Lập 1 File Duy Nhất</p>
            <p className="text-[11px] text-slate-400 mt-1">
              Chứa đầy đủ mã nguồn HTML, CSS Tailwind, JavaScript React & Web Speech API. Mở trực tiếp trên mọi thiết bị không cần kết nối mạng.
            </p>
          </footer>

        </div>
      );
    }

    // KHỞI TẠO VÀ RENDER REACT VÀO DOM
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
